name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  appx:
    runs-on: windows-2025
    env:
      VCPKG_ROOT: C:\vcpkg-pinned
    steps:
      - uses: actions/checkout@v4

      # angle only gets rebuilt when vcpkg.json changes
      - name: Restore angle
        id: angle
        uses: actions/cache/restore@v4
        with:
          path: staging\vcpkg_installed
          key: angle-x64-uwp-${{ hashFiles('vcpkg.json') }}

      - name: Build angle
        if: steps.angle.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $b = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git clone --filter=tree:0 https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout $b
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-uwp --x-install-root=staging\vcpkg_installed
          if ($LASTEXITCODE -ne 0) { Get-ChildItem "$env:VCPKG_ROOT\buildtrees\angle" -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $($_.Name)"; Get-Content $_.FullName -Tail 60 }; exit 1 }

      # saved right away so a broken app build doesnt throw away 20 min of angle
      - name: Save angle
        if: steps.angle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: staging\vcpkg_installed
          key: angle-x64-uwp-${{ hashFiles('vcpkg.json') }}

      # so I can build the app on my own pc without vcpkg
      - uses: actions/upload-artifact@v4
        with:
          name: angle-x64-uwp
          path: staging\vcpkg_installed\x64-uwp

      # mobileglues only gets rebuilt when the patches or compat files change
      - name: Restore mobileglues
        id: mg
        uses: actions/cache/restore@v4
        with:
          path: staging\mg-dll
          key: mg-x64-uwp-${{ hashFiles('mobileglues/**', 'vcpkg.json') }}

      - name: Build mobileglues
        if: steps.mg.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          .\mobileglues\build.ps1 -AngleDir staging\vcpkg_installed\x64-uwp
          New-Item -ItemType Directory -Force staging\mg-dll | Out-Null
          Copy-Item staging\mg-build\mobileglues.dll staging\mg-dll

      - name: Save mobileglues
        if: steps.mg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: staging\mg-dll
          key: mg-x64-uwp-${{ hashFiles('mobileglues/**', 'vcpkg.json') }}

      # 17 for minecraft 1.17.1, 21 for 1.21.11
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17

      - name: Build java runtimes
        shell: powershell
        run: .\java\build.ps1 -Jdk $env:JAVA_HOME_17_X64 -Jdk21 $env:JAVA_HOME_21_X64

      - name: Build app
        shell: powershell
        run: .\build.ps1 -AngleDir staging\vcpkg_installed\x64-uwp -MobileGluesDll staging\mg-dll\mobileglues.dll -Version "0.1.${{ github.run_number }}.0"

      - uses: actions/upload-artifact@v4
        with:
          name: xbox-mc-appx
          path: out\*
